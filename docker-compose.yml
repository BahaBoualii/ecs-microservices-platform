# Local development stack: the three services plus Redis and DynamoDB Local.
# Nginx plays the ALB's role, routing /api/auth/* and /api/orders/* on port 8000.
#   docker compose up --build
#   (see README "Running locally")
services:
  gateway:
    image: public.ecr.aws/nginx/nginx:stable-alpine
    ports: ["8000:80"]
    volumes: ["./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [auth, orders]

  auth:
    build: ./services/auth
    environment:
      JWT_SECRET: local-dev-only-secret
      AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR

  orders:
    build: ./services/orders
    environment:
      AUTH_SERVICE_URL: http://auth:3000
      NOTIFICATIONS_SERVICE_URL: http://notifications:3000
      REDIS_HOST: redis
      ORDERS_TABLE: saa-microservices-orders
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR
    depends_on:
      dynamodb-init: {condition: service_completed_successfully}
      redis: {condition: service_started}

  notifications:
    build: ./services/notifications
    environment:
      AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine

  dynamodb:
    image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  # Creates the same table shape as OrdersTable in infra/03-services.yaml.
  dynamodb-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on: [dynamodb]
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 15); do
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 --table-name saa-microservices-orders
        --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=orderId,AttributeType=S
        --key-schema AttributeName=userId,KeyType=HASH AttributeName=orderId,KeyType=RANGE
        --billing-mode PAY_PER_REQUEST >/dev/null && exit 0;
        sleep 2;
        done; exit 1
